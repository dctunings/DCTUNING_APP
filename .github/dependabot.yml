version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "dctuning/core-team"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "dctuning/core-team"
    labels:
      - "dependencies"
      - "bridge"
